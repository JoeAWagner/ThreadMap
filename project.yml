# XcodeGen spec. Regenerate the project with:
#   brew install xcodegen && xcodegen generate
#
# The .xcodeproj is intentionally not committed — it's generated output, and
# generating it means the file list can't drift from what's on disk.
name: ThreadMap
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""          # set your team, or configure it in Xcode

targets:
  ThreadMap:
    type: application
    platform: iOS
    sources:
      - path: ThreadMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ThreadMap
        # Kept identifier-safe so the Swift module is `ThreadMap` and tests can
        # `@testable import ThreadMap`. The name on the home screen comes from
        # CFBundleDisplayName in Info.plist instead.
        PRODUCT_NAME: ThreadMap
        INFOPLIST_FILE: ThreadMap/Info.plist
        CODE_SIGN_ENTITLEMENTS: ThreadMap/ThreadMap.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - sdk: HomeKit.framework
      - sdk: ThreadNetwork.framework
      - sdk: Network.framework
    scheme:
      testTargets:
        - ThreadMapTests
      gatherCoverageData: true

  ThreadMapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ThreadMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ThreadMapTests
        GENERATE_INFOPLIST_FILE: YES
