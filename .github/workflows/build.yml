name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Any available iPhone simulator will do for unit tests. Kept as plain
      # shell: an inline python heredoc inside a YAML block scalar has to stay
      # indented past the `run:` key, and silently breaks the file if it isn't.
      - name: Pick an available iOS simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available \
            | grep 'iPhone' \
            | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' \
            | head -1)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator: ${UDID:-none found}"
          xcrun simctl list devices available | head -30

      # Simulator builds skip code signing entirely, so the HomeKit, Thread and
      # multicast entitlements don't need a provisioning profile in CI.
      - name: Build
        id: build
        run: |
          set -o pipefail
          xcodebuild build \
            -project ThreadMap.xcodeproj \
            -scheme ThreadMap \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log
        continue-on-error: true

      # xcodebuild's raw output buries the useful lines in thousands of others.
      - name: Summarise diagnostics
        if: always()
        run: |
          echo "### Errors" >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:" build.log | sed 's/^/    /' | sort -u | head -80 \
            | tee -a "$GITHUB_STEP_SUMMARY" || echo "none"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Warnings" >> "$GITHUB_STEP_SUMMARY"
          grep -E "warning:" build.log | sed 's/^/    /' | sort -u | head -40 \
            | tee -a "$GITHUB_STEP_SUMMARY" || echo "none"

      - name: Fail if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Test
        if: steps.build.outcome == 'success' && steps.sim.outputs.udid != ''
        run: |
          set -o pipefail
          xcodebuild test \
            -project ThreadMap.xcodeproj \
            -scheme ThreadMap \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log | grep -E "Test Case|error:|failed|passed|Executed" || true
          grep -qF "TEST SUCCEEDED" test.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
          retention-days: 7
